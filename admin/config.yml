            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - { name: "text", label: "লেখা", widget: "string" }
          - { name: "submit_title", label: "“লেখা পাঠান” শিরোনাম", widget: "string" }
          - { name: "submit_intro", label: "“লেখা পাঠান” পরিচিতি ও শর্ত", widget: "text" }

      - name: "quotes"
        label: "স্বাগত বাণী (পপআপ)"
        file: "content/quotes.json"
        description: "সাইটে ঢোকার সময় যে আয়াত, হাদীস বা বাণী দেখানো হবে। তালিকা থেকে একটি এলোমেলোভাবে বাছা হয়।"
        fields:
          - { name: "enabled", label: "পপআপ চালু", widget: "boolean", default: true }
          - { name: "show_once_per_visit", label: "একবার দেখানোর পর ওই ভিজিটে আর না দেখানো", widget: "boolean", default: true }
          - name: "quotes"
            label: "বাণীসমূহ"
            label_singular: "নতুন বাণী"
            widget: "list"
            summary: "{{fields.text}}"
            collapsed: true
            fields:
              - { name: "text", label: "আয়াত / হাদীস / বাণী", widget: "text" }
              - { name: "source", label: "সূত্র", widget: "string" }

      - name: "feedback"
        label: "পাঠকের অনুভূতি"
        file: "content/feedback.json"
        description: "পাঠকদের মতামত। যাঁর কথা লিখছেন, তাঁর অনুমতি নিয়ে নেবেন।"
        fields:
          - { name: "intro", label: "সেকশনের পরিচিতি", widget: "text", required: false }
          - name: "items"
            label: "তালিকা"
            label_singular: "নতুন অনুভূতি"
            widget: "list"
            summary: "{{fields.name}} — {{fields.meta}}"
            collapsed: true
            fields:
              - { name: "name", label: "নাম", widget: "string" }
              - { name: "meta", label: "পরিচয়", widget: "string", required: false,
                  hint: "যেমন: শিক্ষার্থী — ঢাকা। না দিলেও চলবে।" }
              - { name: "text", label: "যা বলেছেন", widget: "text" }
              - { name: "demo", label: "নমুনা", widget: "boolean", default: false,
                  hint: "টিক দিলে পাশে “নমুনা” লেখা দেখাবে। আসল মতামত যোগ করার সময় টিক তুলে দেবেন।" }

      - name: "outlets"
        label: "এজেন্ট ও মাকতাবা"
        file: "content/outlets.json"
        description: "সংখ্যা বাড়লে বিভাগ ও জেলা ধরে ছাঁকনি চালু করা হবে, তাই ঘরগুলো এখনই পূরণ করে রাখলে ভালো।"
        fields:
          - { name: "intro", label: "সেকশনের পরিচিতি", widget: "text" }
          - name: "outlets"
            label: "তালিকা"
            label_singular: "নতুন এজেন্ট / মাকতাবা"
            widget: "list"
            summary: "{{fields.name}} — {{fields.district}}"
            collapsed: true
            fields:
              - { name: "name", label: "নাম", widget: "string" }
              - { name: "kind", label: "ধরন", widget: "select", options: ["মাকতাবা", "এজেন্ট"], default: "মাকতাবা" }
              - { name: "address", label: "ঠিকানা", widget: "text" }
              - { name: "phone", label: "ফোন", widget: "string" }
              - { name: "map", label: "গুগল ম্যাপ লিংক", widget: "string", required: false,
                  hint: "গুগল ম্যাপে জায়গাটি খুলে Share → Copy link করে এখানে বসান।" }
              - { name: "division", label: "বিভাগ", widget: "string", required: false }
              - { name: "district", label: "জেলা", widget: "string", required: false }
              - { name: "thana", label: "থানা / উপজেলা", widget: "string", required: false }

