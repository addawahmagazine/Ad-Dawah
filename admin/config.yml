        file: "content/ads.json"
        description: "“চালু” বন্ধ থাকলে বিজ্ঞাপনটি সাইটে দেখাবে না। কোনো অবস্থানে চালু বিজ্ঞাপন না থাকলে জায়গাটি নিজে থেকেই লুকিয়ে যাবে।"
        fields:
          - name: "ads"
            label: "বিজ্ঞাপন"
            label_singular: "নতুন বিজ্ঞাপন"
            widget: "list"
            summary: "{{fields.title}} ({{fields.position}})"
            collapsed: true
            fields:
              - { name: "title", label: "বিজ্ঞাপনের নাম", widget: "string",
                  hint: "ছবি লোড না হলে এই লেখাটি দেখাবে।" }
              - { name: "image", label: "ছবি", widget: "image", required: false,
