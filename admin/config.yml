  # --------------------------------------------------------- পাতার লেখা
  - name: "pages"
    label: "পাতার লেখা"
    files:
      - name: "about"
        label: "আমাদের সম্পর্কে ও ফর্মের লেখা"
        file: "content/about.json"
        fields:
          - { name: "heading", label: "সেকশনের শিরোনাম", widget: "string" }
          - name: "paragraphs"
            label: "অনুচ্ছেদসমূহ"
            label_singular: "নতুন অনুচ্ছেদ"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - { name: "text", label: "লেখা", widget: "text", hint: "সাজসজ্জা: **বোল্ড**  *ইটালিক*  __আন্ডারলাইন__  [লেখা](লিংক)" }
          - { name: "board_title", label: "পরিষদের শিরোনাম", widget: "string", default: "সম্পাদনা পরিষদ" }
