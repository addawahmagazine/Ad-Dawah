# =========================================================================
#  আদ দাওয়াহ — অ্যাডমিন প্যানেল কনফিগারেশন
#
#  ⚠️  নিচের "repo" লাইনে আপনার গিটহাব ইউজারনেম ও রিপোজিটরির নাম আছে।
#      রিপোর নাম বদলালে এটিও বদলাতে হবে।
# =========================================================================

backend:
  name: github
  repo: addawahmagazine/Ad-Dawah
  branch: main
  commit_messages:
    create: 'নতুন যোগ: {{collection}} “{{slug}}” [skip ci]'
    update: 'সম্পাদনা: {{collection}} “{{slug}}” [skip ci]'
    delete: 'মুছে ফেলা: {{collection}} “{{slug}}” [skip ci]'
    uploadMedia: 'ফাইল আপলোড: {{path}} [skip ci]'
    deleteMedia: 'ফাইল মুছে ফেলা: {{path}} [skip ci]'

local_backend: true

media_folder: "uploads"
public_folder: "/uploads"

publish_mode: simple

collections:
  # ---------------------------------------------------------------- লেখা
  - name: "articles"
    label: "লেখাসমূহ"
    files:
      - name: "articles"
        label: "সব লেখা"
        file: "content/articles.json"
        description: "নতুন লেখা যোগ করতে নিচে “Add নতুন লেখা” বোতামে চাপুন।"
        fields:
          - name: "articles"
            label: "লেখা"
            label_singular: "নতুন লেখা"
            widget: "list"
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { name: "title", label: "শিরোনাম", widget: "string" }
              - { name: "id", label: "লিংক-নাম (ইংরেজি অক্ষরে, অনন্য)", widget: "string",
                  hint: "যেমন: khatme-nubuwat। বাংলা অক্ষর বা ফাঁকা জায়গা দেবেন না।",
                  pattern: ['^[a-z0-9-]+$', 'কেবল ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন'] }
              - { name: "thumb", label: "থাম্বনেইল ছবি", widget: "image", required: false,
                  hint: "কার্ডে দেখানো ছবি। প্রস্থ ৮০০ থেকে ১২০০ পিক্সেল হলে ভালো। না দিলে রঙিন প্রচ্ছদ তৈরি হবে।" }
              - { name: "excerpt", label: "সংক্ষিপ্তসার / চুম্বকাংশ", widget: "text", required: false,
                  hint: "না দিলেও চলবে। কার্ডে যে দুই-তিন লাইন দেখাবে। ফাঁকা রাখলে মূল লেখার শুরুর অংশ দেখাবে।" }
              - { name: "date", label: "প্রকাশের তারিখ", widget: "datetime", required: false,
                  date_format: "DD/MM/YYYY", time_format: false, picker_utc: false,
                  hint: "“সর্বশেষ লেখা” অনুযায়ী সাজাতে এটি ব্যবহৃত হয়।" }
              - name: "cat"
                label: "বিভাগ"
                widget: "relation"
                collection: "taxonomy"
                file: "categories"
                value_field: "categories.*.id"
                display_fields: ["categories.*.name"]
                search_fields: ["categories.*.name"]
              - name: "author"
                label: "লেখক"
                widget: "relation"
                collection: "taxonomy"
                file: "authors"
                required: false
                value_field: "authors.*.id"
                display_fields: ["authors.*.name"]
                search_fields: ["authors.*.name"]
                hint: "তালিকায় থাকা লেখক হলে এখান থেকে বেছে নিন। অতিথি লেখক হলে এটি ফাঁকা রেখে নিচের ঘরে নাম লিখুন।"
              - { name: "guest", label: "অতিথি লেখকের নাম", widget: "string", required: false,
                  hint: "যিনি লেখকবৃন্দের তালিকায় নেই, তাঁর নাম এখানে লিখুন। লিখলে উপরের লেখক বাছাই আর কাজে লাগবে না।" }
              - name: "kind"
                label: "প্রকাশের ধরন"
                widget: "select"
                default: "magazine"
                options:
                  - { label: "পত্রিকায় প্রকাশিত", value: "magazine" }
                  - { label: "কেবল ওয়েবসাইটে", value: "web" }
              - name: "issue"
                label: "কোন সংখ্যায়"
                widget: "relation"
                required: false
                collection: "taxonomy"
                file: "issues"
                value_field: "issues.*.id"
                display_fields: ["issues.*.label"]
                search_fields: ["issues.*.label"]
                hint: "পত্রিকায় প্রকাশিত হলে সংখ্যাটি বাছুন। কেবল ওয়েবসাইটের লেখা হলে ফাঁকা রাখুন।"
              - { name: "page", label: "পত্রিকার পৃষ্ঠা নম্বর", widget: "number", value_type: "int",
                  required: false, min: 1,
                  hint: "ঐচ্ছিক। পত্রিকার লেখা হলে পৃষ্ঠা নম্বর দিলে পাঠক মিলিয়ে নিতে পারবেন।" }
              - { name: "read", label: "পড়ার সময় (মিনিট)", widget: "number", required: false,
                  value_type: "int", min: 1, max: 90,
                  hint: "না দিলেও চলবে। ফাঁকা রাখলে সাইটে দেখাবে না।" }
              - { name: "lead", label: "হোমপেজের প্রধান লেখা", widget: "boolean", default: false,
                  hint: "প্রতি সংখ্যায় একটিমাত্র লেখায় এটি চালু রাখুন।" }
              - name: "body"
                label: "মূল লেখা"
                label_singular: "নতুন অংশ"
                widget: "list"
                types:
                  - name: "para"
                    label: "অনুচ্ছেদ"
                    summary: "{{fields.text}}"
                    fields:
                      - { name: "text", label: "লেখা", widget: "text", hint: "সাজসজ্জা: **বোল্ড**  *ইটালিক*  __আন্ডারলাইন__  [লেখা](লিংক)" }
                      - name: "size"
                        label: "লেখার আকার"
                        widget: "select"
                        default: "normal"
                        options:
                          - { label: "সাধারণ", value: "normal" }
                          - { label: "বড়", value: "big" }
                          - { label: "ছোট", value: "small" }
                  - name: "heading"
                    label: "উপশিরোনাম"
                    summary: "{{fields.text}}"
                    fields:
                      - { name: "text", label: "উপশিরোনাম", widget: "string" }
                  - name: "refute"
                    label: "খণ্ডন (দাবি ও জবাব)"
                    summary: "খণ্ডন — {{fields.claim}}"
                    fields:
                      - { name: "claim", label: "দাবি", widget: "text",
                          hint: "প্রতিপক্ষের বক্তব্য যতটা সম্ভব হুবহু লিখুন।" }
                      - { name: "answer", label: "জবাব", widget: "text",
                          hint: "কুরআন, সুন্নাহ ও স্বীকৃত উৎস থেকে দলিলসহ।" }
                  - name: "quote"
                    label: "উদ্ধৃতি (আয়াত / হাদীস)"
                    summary: "{{fields.text}}"
                    fields:
                      - { name: "text", label: "উদ্ধৃতি", widget: "text" }
                      - { name: "source", label: "সূত্র", widget: "string",
                          hint: "যেমন: সূরা আল-বাকারা, আয়াত ২৫৬" }
                  - name: "image"
                    label: "ছবি"
                    summary: "ছবি — {{fields.caption}}"
                    fields:
                      - { name: "src", label: "ছবি", widget: "image" }
                      - { name: "caption", label: "ছবির নিচের লেখা", widget: "string", required: false }

  # ------------------------------------------------- সংখ্যা, লেখক, বিভাগ
  - name: "taxonomy"
    label: "সংখ্যা ও লেখক"
    files:
      - name: "issues"
        label: "সংখ্যাসমূহ"
        file: "content/issues.json"
        description: "“প্রকাশিত” চালু করলে সেটি হোমপেজের প্রধান সংখ্যা হবে। অপ্রকাশিত সংখ্যার জন্য “প্রি-অর্ডার নেওয়া হচ্ছে” চালু করলে হোমপেজে প্রি-অর্ডার ব্যানার দেখাবে।"
        fields:
          - name: "issues"
            label: "সংখ্যা"
            label_singular: "নতুন সংখ্যা"
            widget: "list"
            summary: "{{fields.label}} — {{fields.greg}}"
            collapsed: true
            fields:
              - { name: "label", label: "সংখ্যার নাম", widget: "string", hint: "যেমন: বর্ষ ১, সংখ্যা ২" }
              - { name: "id", label: "লিংক-নাম (ইংরেজি, অনন্য)", widget: "string",
                  hint: "যেমন: AdDawah.1 বা y1n2। ইংরেজি অক্ষর, সংখ্যা, বিন্দু, হাইফেন ও আন্ডারস্কোর চলবে — ফাঁকা জায়গা বা বাংলা অক্ষর নয়। ⚠️ একবার দিয়ে দিলে আর বদলাবেন না, নইলে ওই সংখ্যার লেখাগুলোর সঙ্গে সম্পর্ক ছিঁড়ে যাবে।",
                  pattern: ['^[A-Za-z0-9._-]+$', 'ইংরেজি অক্ষর, সংখ্যা, বিন্দু, হাইফেন ও আন্ডারস্কোর চলবে'] }
              - { name: "hijri", label: "হিজরি তারিখ", widget: "string", hint: "যেমন: জুমাদাল ঊলা ১৪৪৮" }
              - { name: "greg", label: "ইংরেজি তারিখ", widget: "string", hint: "যেমন: নভেম্বর ২০২৬" }
              - { name: "published", label: "প্রকাশিত", widget: "boolean", default: false }
              - { name: "preorder", label: "প্রি-অর্ডার নেওয়া হচ্ছে", widget: "boolean", default: false, required: false,
                  hint: "অপ্রকাশিত সংখ্যার জন্য চালু করলে হোমপেজে আলাদা প্রি-অর্ডার ব্যানার দেখাবে।" }
              - { name: "preorder_note", label: "প্রি-অর্ডারের ছোট বর্ণনা", widget: "text", required: false,
                  hint: "যেমন: এই সংখ্যার মূল প্রতিবেদন — তাকদীর প্রসঙ্গে সংশয় নিরসন।" }
              - { name: "pages", label: "পৃষ্ঠা সংখ্যা", widget: "number", value_type: "int", default: 96, required: false }
              - { name: "pdf", label: "শর্ট পিডিএফ", widget: "file", required: false,
                  hint: "এই ঘরের ফাইলটি সবার জন্য খোলা থাকে। দাম ০ রাখলে এখানেই সম্পূর্ণ পিডিএফ দিন। দাম বসালে এখানে দিন ৮-১০ পৃষ্ঠার শর্ট পিডিএফ, আর সম্পূর্ণ ফাইলটি রাখুন Supabase Storage-এ।" }
              - { name: "pdf_price", label: "পিডিএফের দাম (৳)", widget: "number", value_type: "int",
                  required: false, default: 0, min: 0,
                  hint: "০ রাখলে উপরের পিডিএফটি সবার জন্য বিনামূল্যে। দাম বসালে উপরেরটি শর্ট পিডিএফ হিসেবে গণ্য হবে, আর সম্পূর্ণ ফাইলটি Supabase Storage-এর issues বাকেটে <আইডি>.pdf নামে আপলোড করতে হবে — যেমন AdDawah.1.pdf" }
              - { name: "cover", label: "প্রচ্ছদের ছবি", widget: "image", required: false,
                  hint: "না দিলে স্বয়ংক্রিয়ভাবে একটি প্রচ্ছদ তৈরি হবে।" }
              - name: "preview"
                label: "ভেতরের প্রিভিউ পৃষ্ঠা"
                label_singular: "নতুন পৃষ্ঠা"
                widget: "list"
                required: false
                field: { name: "img", label: "পৃষ্ঠার ছবি", widget: "image" }
                hint: "পত্রিকার ভেতরের ২-৪টি পৃষ্ঠার ছবি দিন (পিডিএফ থেকে JPG করে নিন)। পাঠক পিডিএফ জানালায় প্রচ্ছদের পর এগুলো উল্টে দেখতে পাবেন। না দিলে কেবল প্রচ্ছদ ও সূচিপত্র দেখাবে।"
              - { name: "tagline", label: "ছোট নোট", widget: "string", required: false,
                  default: "প্রস্তুত হচ্ছে" }
              - { name: "bg", label: "প্রচ্ছদের রঙ", widget: "color", default: "#064E3B", required: false }
              - { name: "accent", label: "প্রচ্ছদের সোনালি রঙ", widget: "color", default: "#D97706", required: false }

      - name: "authors"
        label: "লেখকবৃন্দ"
        file: "content/authors.json"
        fields:
          - name: "authors"
            label: "লেখক"
            label_singular: "নতুন লেখক"
            widget: "list"
            summary: "{{fields.name}}"
            collapsed: true
            fields:
              - { name: "name", label: "নাম", widget: "string" }
              - { name: "id", label: "লিংক-নাম (ইংরেজি)", widget: "string",
                  pattern: ['^[a-z0-9-]+$', 'কেবল ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন'] }
              - { name: "photo", label: "ছবি", widget: "image", required: false,
                  hint: "বর্গাকার ছবি হলে ভালো দেখায়। না দিলে নামের প্রথম অক্ষর দেখাবে।" }
              - { name: "role", label: "পদ / পরিচয়", widget: "string", required: false, hint: "না দিলেও চলবে। যেমন: নিয়মিত লেখক" }
              - { name: "bio", label: "সংক্ষিপ্ত পরিচিতি", widget: "text", required: false }
              - { name: "featured", label: "নিয়মিত লেখক", widget: "boolean", default: true,
                  hint: "টিক থাকলে লেখকবৃন্দ পাতায় ছবি ও পরিচিতিসহ উপরে দেখাবেন। টিক তুলে দিলে নিচের ছোট তালিকায় কেবল নাম থাকবে।" }

      - name: "categories"
        label: "বিভাগসমূহ"
        file: "content/categories.json"
        fields:
          - name: "categories"
            label: "বিভাগ"
            label_singular: "নতুন বিভাগ"
            widget: "list"
            summary: "{{fields.name}}"
            collapsed: true
            fields:
              - { name: "name", label: "বিভাগের নাম", widget: "string" }
              - { name: "id", label: "লিংক-নাম (ইংরেজি)", widget: "string",
                  pattern: ['^[a-z0-9-]+$', 'কেবল ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন'] }
              - { name: "desc", label: "পরিচিতি", widget: "text" }
              - { name: "color", label: "রঙ", widget: "color", default: "#0F5132" }
              - { name: "icon", label: "আইকনের SVG path", widget: "string", required: false,
                  default: "M12 3l7 4v5c0 4.4-3 8.3-7 9-4-.7-7-4.6-7-9V7l7-4z",
                  hint: "কারিগরি ঘর — না বুঝলে যা আছে তা-ই থাক।" }

  # ---------------------------------------------- কার্ড, মিডিয়া, প্রশ্নোত্তর
  - name: "media"
    label: "কার্ড ও মিডিয়া"
    files:
      - name: "media"
        label: "দাওয়াহ কার্ড, ইনফোগ্রাফিক্স, অডিও-ভিডিও, প্রশ্নোত্তর"
        file: "content/media.json"
        fields:
          - name: "infographics"
            label: "দাওয়াহ কার্ড"
            label_singular: "নতুন কার্ড"
            widget: "list"
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { name: "image", label: "কার্ডের ছবি", widget: "image", required: false,
                  hint: "ছবি দিলে সেটিই কার্ড হিসেবে দেখাবে। না দিলে নিচের রঙ ও লেখা দিয়ে কার্ড তৈরি হবে।" }
              - { name: "title", label: "কার্ডের মূল কথা", widget: "text" }
              - { name: "sub", label: "নিচের ছোট লাইন", widget: "string" }
              - name: "article"
                label: "কোন লেখার সঙ্গে যুক্ত"
                widget: "relation"
                required: false
                collection: "articles"
                file: "articles"
                value_field: "articles.*.id"
                display_fields: ["articles.*.title"]
                search_fields: ["articles.*.title"]
