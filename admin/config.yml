            widget: "list"
            summary: "{{fields.role}} — {{fields.name}}"
            fields:
              - { name: "role", label: "পদ", widget: "string" }
              - { name: "name", label: "নাম", widget: "string" }
          - { name: "qa_intro", label: "“আপনার জিজ্ঞাসা”-র পরিচিতি", widget: "text" }
          - name: "qa_points"
            label: "জিজ্ঞাসার নিয়মাবলি"
