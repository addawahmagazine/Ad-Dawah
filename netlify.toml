# আদ দাওয়াহ — Netlify কনফিগারেশন
# কোনো বিল্ড স্টেপ নেই; ফোল্ডারটি সরাসরি পাবলিশ হয়।

[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# কোড ফাইল — প্রতিবার যাচাই হবে, নইলে পুরোনো সংস্করণ আটকে থাকে
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ফন্ট ও লোগো — বদলায় না, তাই দীর্ঘ ক্যাশ
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# আপলোড করা ছবি ও ফাইল — প্রতিবার যাচাই হবে।
# আগে ৩০ দিনের ক্যাশ ছিল, ফলে ছবি আপলোডের আগে কেউ পাতাটি খুললে
# "ছবি নেই" উত্তরটিও এক মাসের জন্য ব্রাউজারে আটকে যেত।
# যাচাই হলেও ছবি নতুন করে নামে না — বদলায়নি বুঝলে ব্রাউজার আগেরটিই দেখায়।
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/issues/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# কনটেন্ট ফাইল সবসময় টাটকা আসবে (CMS-এ সেভ করার পরপরই)
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
